# Weekly check that Dryas still works with the latest Ruflo.
# Plugins (superpowers, impeccable, ui-ux-pro-max) are not checked here
# because the Claude Code CLI is not available in CI.
name: latest-compat
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  latest-ruflo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g ruflo
      - run: ruflo --version
      - run: python -c "import shutil, sys; sys.path.insert(0, 'install'); import ruflo_helpers as rh; rh.patched_helpers(shutil.which('ruflo') or ''); print('ruflo helper patches apply')"
      - run: python -m pip install pytest
      - run: python -m pytest -q claude/jev/tests install/tests claude/ruflo/tests
      - run: node claude/ruflo/tests/test_ns.cjs
